name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, develop]
  push:
    branches: [main, develop]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-changes:
    name: Validate Changes (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22"]

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Install Node.js dependencies
        run: npm ci

      # Run pre-commit on all files - this covers:
      # - Prettier formatting (TypeScript/JavaScript/JSON/Markdown)
      # - ESLint (TypeScript/JavaScript) with --fix
      # - TypeScript type checking
      # - Ruff linting and formatting (Python)
      # - Trailing whitespace, end-of-file fixes
      # - YAML/JSON validation
      # - Merge conflict detection
      # - Large file detection
      # - Secret detection
      # pre-commit/action is not used for now: its latest release (v3.0.1, also
      # its main branch) still calls actions/cache@v4, which targets Node.js 20
      # ("Node.js 20 is deprecated..." on the run summary). The maintainer
      # declined the bump (pre-commit/action#241, #243, PRs #242, #244: the
      # runner runs it on Node 24 anyway). The two steps below do what it does.
      # Once a release uses a Node 24 actions/cache, it can replace them:
      # - name: Run pre-commit on all files
      #   uses: pre-commit/action@v3.0.1
      #   with:
      #     extra_args: --all-files --verbose
      - name: pre-commit hook environments (cache)
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        shell: bash
        run: pre-commit run --show-diff-on-failure --color=always --all-files --verbose

      # Additional checks not covered by pre-commit
      - name: Compile TypeScript
        run: npm run compile

      - name: Setup virtual display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Setup virtual display (Windows)
        if: matrix.os == 'windows-latest'
        uses: pyvista/setup-headless-display-action@v3
        with:
          pyvista: "false"
      - name: Run tests with virtual display (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
          npm run test
      - name: Run tests with virtual display (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run test
      - name: Package extension
        run: npm run package
        if: matrix.node-version == '22'

      - name: Run security audit
        run: npm audit --audit-level=moderate
