<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Viridis color gradients -->
    <linearGradient id="viridisTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f9e89;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central data core - smaller to show bold cross -->
  <circle cx="79" cy="64" r="12" fill="none" stroke="url(#viridisTeal)" stroke-width="6"/>
  
  <!-- Diagonal directions (thinner) -->
  <line x1="39" y1="24" x2="63" y2="48" stroke="url(#viridisTeal)" stroke-width="8"/>
  <line x1="119" y1="24" x2="95" y2="48" stroke="url(#viridisTeal)" stroke-width="8"/>
  <line x1="39" y1="104" x2="63" y2="80" stroke="url(#viridisTeal)" stroke-width="8"/>
  <line x1="119" y1="104" x2="95" y2="80" stroke="url(#viridisTeal)" stroke-width="8"/>
  
  <!-- Data nodes -->
  <circle cx="51" cy="64" r="8" fill="url(#viridisTeal)"/>
  <circle cx="107" cy="64" r="8" fill="url(#viridisTeal)"/>
  <circle cx="80" cy="36" r="8" fill="url(#viridisTeal)"/>
  <circle cx="80" cy="92" r="8" fill="url(#viridisTeal)"/>
</svg>
